[project]
name = "clipfi-offchain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
chain = ["solana>=0.34", "solders>=0.21"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
