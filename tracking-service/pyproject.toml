[project]
name = "tracking-service"
version = "0.1.0"
description = "Reflink redirects and click counting (Redis -> PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "redis>=5.0,<9",
    "asyncpg>=0.29,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "fakeredis[lua]>=2.23",
    "hypothesis>=6.100",
    "pyyaml>=6",
    "testcontainers[postgres,redis]>=4.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracking", "tracking.api"]

[tool.setuptools.package-data]
tracking = ["lua/*.lua", "migrations/*.sql"]
