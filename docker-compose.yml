include:
  - tracking-service/docker-compose.yml
  - auth-service/docker-compose.yml

services:
  postgres_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fastapi_backend
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ${CLIPFI_IDL_DIR:-./clipfi-escrow/idl}:/clipfi/idl:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@postgres_db:5432/postgres
      TRACKING_INTERNAL_URL: http://api-internal:8000
      TRACKING_REDIRECT_BASE: http://localhost:8080/r
      TRACKING_SERVICE_TOKEN: ${TRACKING_SERVICE_TOKEN:?set TRACKING_SERVICE_TOKEN in .env, the same value as in tracking-service/.env}
    networks:
      - default
      - services
    depends_on:
      postgres_db:
        condition: service_healthy
      api-internal:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: vue_frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
