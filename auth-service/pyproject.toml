[project]
name = "auth-service"
version = "0.1.0"
description = "Waggi auth service (identity: users, credentials, JWT, JWKS)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pyjwt[crypto]>=2.9,<3",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "pyotp>=2.9,<3",
    "webauthn>=2.5,<3",
    "redis>=5.3,<10",
    "httpx>=0.27,<1",
    "limits[async-redis]>=5,<10",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "fakeredis[lua]>=2.23",
    "respx>=0.21",
    "freezegun>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "waggi_auth",
    "waggi_auth.providers",
    "waggi_auth.routers",
    "waggi_auth.schemas",
    "waggi_auth.security",
    "waggi_auth.stores",
    "waggi_shared",
]
